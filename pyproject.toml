[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "raon"
dynamic = ["version"]
description = "Research framework for LLM-assisted vulnerability discovery: fuzzing, multi-agent triage, and binary analysis on one shared model"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Junwon Lee" }]
keywords = ["fuzzing", "security", "vulnerability", "llm", "multi-agent", "binary-analysis"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2.6",
]

[project.optional-dependencies]
llm = [
    "anthropic>=0.40",
]
binary = [
    "angr>=9.2",
    "pyelftools>=0.30",
    "lief>=0.14",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
raon = "raon.cli:main"

[project.urls]
Homepage = "https://github.com/cpprhtn/raon"
Repository = "https://github.com/cpprhtn/raon"

[tool.hatch.build.targets.wheel]
packages = ["src/raon"]

[tool.hatch.version]
path = "src/raon/__init__.py"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter; long tables/urls allowed

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
disallow_untyped_defs = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
packages = ["raon"]

[[tool.mypy.overrides]]
module = ["anthropic.*", "angr.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: end-to-end tests requiring external tooling (clang, docker)",
    "llm: tests that exercise a live LLM provider (skipped without API key)",
]

[tool.coverage.run]
source = ["raon"]
branch = true
