name: Magma benchmark

# Manual, on-demand Magma campaign on an x86_64 Linux runner (Magma has no
# arm64 support, so this cannot run on Apple Silicon locally). raon is an
# analysis layer, not a fuzzer, so this uses Magma's stock fuzzer (libfuzzer by
# default) and has raon CONSUME the results: it parses the canary `monitor`
# ground truth via raon.bench. Real reached/triggered metrics are uploaded as an
# artifact.
#
# Trigger from the Actions tab (workflow_dispatch). Keep the timeout modest for a
# smoke run; raise it for a proper campaign. The Magma image build is heavy
# (it compiles libFuzzer from an LLVM checkout), so allow ample job time.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Magma target"
        default: "libpng"
      program:
        description: "Harness program"
        default: "libpng_read_fuzzer"
      fuzzer:
        description: "Stock Magma fuzzer to drive the campaign"
        default: "libfuzzer"
      timeout:
        description: "Campaign length (Magma format, e.g. 10m, 1h)"
        default: "10m"

jobs:
  magma:
    runs-on: ubuntu-latest  # x86_64
    timeout-minutes: 300
    steps:
      - name: Checkout raon
        uses: actions/checkout@v4
        with:
          path: raon

      - name: Checkout Magma (v1.2)
        uses: actions/checkout@v4
        with:
          repository: HexHive/magma
          ref: v1.2
          path: magma

      - name: AFL core_pattern (required by Magma)
        run: sudo bash -c 'echo core > /proc/sys/kernel/core_pattern'

      - name: Build Magma image
        working-directory: magma
        run: FUZZER=${{ inputs.fuzzer }} TARGET=${{ inputs.target }} ./tools/captain/build.sh

      - name: Run campaign
        working-directory: magma
        run: |
          # SHARED must live outside the repo tree (Magma docker-context gotcha)
          # and must be pre-created by us: start.sh bind-mounts it into the
          # container, and if it doesn't exist Docker creates it as root, so the
          # container's non-root magma user can't write monitor/findings. Create
          # it here (as the runner) and make it world-writable to be safe.
          SHARED="$RUNNER_TEMP/magma_workdir"
          mkdir -p "$SHARED"
          chmod 777 "$SHARED"
          FUZZER=${{ inputs.fuzzer }} TARGET=${{ inputs.target }} \
          PROGRAM=${{ inputs.program }} SHARED="$SHARED" \
          POLL=5 TIMEOUT=${{ inputs.timeout }} ./tools/captain/start.sh
          echo "== monitor snapshots ==" && ls -la "$SHARED/monitor" 2>&1 | head

      - name: Parse ground truth with raon.bench
        run: |
          python -m pip install --upgrade pip
          pip install -e raon
          python - <<'PY'
          import json, os, pathlib
          from raon.bench import parse_monitor_dir
          mon = pathlib.Path(os.environ["RUNNER_TEMP"]) / "magma_workdir" / "monitor"
          if not mon.is_dir():
              print("no monitor output found"); raise SystemExit(1)
          c = parse_monitor_dir(mon)
          out = {
              "fuzzer": os.environ.get("FUZZER", "libfuzzer"),
              "bugs_reached": c.bugs_reached,
              "bugs_triggered": c.bugs_triggered,
              "time_to_first_trigger_s": c.time_to_first_trigger(),
              "reached": c.reached,
              "triggered": c.triggered,
          }
          print(json.dumps(out, indent=2))
          pathlib.Path("magma_results.json").write_text(json.dumps(out, indent=2))
          PY
        env:
          FUZZER: ${{ inputs.fuzzer }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: magma-results
          path: |
            magma_results.json
            ${{ runner.temp }}/magma_workdir/monitor
          if-no-files-found: warn
