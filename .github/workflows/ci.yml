name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  # Lint, type-check, and unit tests across Python versions. Unit tests are
  # clang-free by design (integration tests are excluded here).
  lint-type-unit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (types)
        run: mypy

      - name: Pytest (unit only)
        run: pytest -q -m "not integration"

  # Full suite (unit + integration) in the reproducible Docker image, which has
  # clang, the libFuzzer runtime, and llvm coverage tools. This exercises real
  # fuzzing, harness reach-verification, and the self-contained evaluation.
  integration-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f docker/Dockerfile -t raon:ci .

      - name: Full test suite (unit + integration)
        run: docker run --rm raon:ci pytest -q

      - name: Self-contained evaluation
        run: docker run --rm raon:ci python -m raon.bench.eval --time 20
