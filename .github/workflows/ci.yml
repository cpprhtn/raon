name: CI

on:
  push:
    branches: [main, "build/**"]
  pull_request:

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Install clang (ASan/UBSan/libFuzzer)
        run: sudo apt-get update && sudo apt-get install -y clang llvm

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,llm]"

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Mypy (types)
        run: mypy

      - name: Pytest (unit + integration; clang available)
        env:
          ASAN_OPTIONS: abort_on_error=0:detect_leaks=0
        run: pytest -q --cov=raon --cov-report=term-missing
